[package]
name = "epub-page-calculator"
version = "0.1.0"
edition = "2021"
description = "WebAssembly module for accurate EPUB page calculation"
authors = ["Readium Foundation"]
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "Window",
    "DomRect",
    "CssStyleDeclaration",
    "Range",
    "Selection",
    "Node",
    "NodeList",
    "HtmlCollection",
    "Text",
    "Comment",
    "DocumentFragment",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"